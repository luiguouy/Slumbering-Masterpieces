<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Masterpiece Garden · Interactive Art</title>
    <!-- 引入传世名画级古典优雅衬线字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.0.0">
</head>
<body>
    <div id="art-stage">
        <!-- 底层：古典灰阶名画 Canvas (与顶层绝对像素级对齐) -->
        <canvas id="bg-canvas"></canvas>

        <!-- 顶层：动态彩色唤醒 Canvas -->
        <canvas id="reveal-canvas"></canvas>

        <!-- 极简典雅艺术光标 -->
        <div id="custom-cursor">
            <div class="cursor-dot"></div>
            <div class="cursor-ring"></div>
        </div>

        <!-- 全屏仅保留的唯一切题名人名言 (莫奈名言) -->
        <div id="art-quote" class="art-quote-container">
            <p class="quote-text">“I must have flowers, always, and always.”</p>
            <cite class="quote-author">— Claude Monet</cite>
        </div>

        <!-- 画笔大小调节艺术控件 -->
        <div id="brush-control" class="brush-control-panel">
            <button id="brush-toggle-btn" class="brush-btn" title="调节画笔大小" aria-label="调节画笔大小">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18"/>
                    <path d="M2 2l7.586 7.586"/>
                    <circle cx="11" cy="11" r="2"/>
                </svg>
            </button>
            <div id="brush-popup" class="brush-popup">
                <div class="brush-popup-row">
                    <span class="brush-label">画笔大小</span>
                    <span id="brush-size-display" class="brush-value">75px</span>
                </div>
                <div class="brush-slider-container">
                    <input type="range" id="brush-size-slider" min="35" max="160" value="75" step="1">
                </div>
                <div class="brush-preview-wrap">
                    <div id="brush-preview-dot" class="brush-preview-dot"></div>
                </div>
                <div class="brush-popup-divider"></div>
                <div class="brush-popup-row">
                    <span class="brush-label">色彩留存</span>
                    <span id="brush-duration-display" class="brush-value">12秒</span>
                </div>
                <div class="brush-slider-container">
                    <input type="range" id="brush-duration-slider" min="4" max="30" value="12" step="1">
                </div>
                <div class="brush-popup-divider"></div>
                <div class="brush-quick-actions">
                    <button id="toggle-full-color-btn" class="full-color-btn" type="button" title="一键将整幅画还原为原始真彩">
                        <svg class="full-color-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        <span id="full-color-btn-text">一键全彩盛放</span>
                    </button>
                </div>
                <div class="brush-popup-divider"></div>
                <div class="brush-popup-row">
                    <span class="brush-label">名画画廊</span>
                    <span id="masterpiece-index" class="brush-badge">1 / 10</span>
                </div>
                <div class="masterpiece-selector-box">
                    <select id="masterpiece-select" class="masterpiece-dropdown" aria-label="切换传世名画"></select>
                </div>
                <div class="masterpiece-nav-row">
                    <button id="prev-art-btn" class="art-nav-btn" type="button" title="切换上一幅名画">‹ 上一幅</button>
                    <button id="next-art-btn" class="art-nav-btn" type="button" title="切换下一幅名画">下一幅 ›</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 核心渲染脚本 -->
    <script src="app.js?v=3.0.0"></script>
</body>
</html>
