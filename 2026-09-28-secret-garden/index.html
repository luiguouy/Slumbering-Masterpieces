<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Masterpiece Garden · 传世名画博览馆</title>
    <!-- 引入传世名画级古典优雅衬线字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4.0.0">
</head>
<body>
    <div id="art-stage">
        <!-- 底层：古典灰阶名画 Canvas (与顶层绝对像素级对齐) -->
        <canvas id="bg-canvas"></canvas>

        <!-- 顶层：动态彩色唤醒 Canvas -->
        <canvas id="reveal-canvas"></canvas>

        <!-- 极简典雅艺术光标 -->
        <div id="custom-cursor">
            <div class="cursor-dot"></div>
            <div class="cursor-ring"></div>
        </div>

        <!-- 全屏仅保留的唯一切题名人名言 (随名画联动更新) -->
        <div id="art-quote" class="art-quote-container">
            <p class="quote-text">“Simplicity is the ultimate sophistication.”</p>
            <cite class="quote-author">— Leonardo da Vinci</cite>
        </div>

        <!-- 随机漫游模式 · 实时擦除进度浮动胶囊 (仅在随机漫游模式下显现) -->
        <div id="scratch-hud" class="scratch-hud" style="display: none;">
            <div class="scratch-hud-pill">
                <span class="scratch-hud-icon">🎲</span>
                <span class="scratch-hud-label">揭开下一幅:</span>
                <span id="scratch-hud-percent" class="scratch-hud-val">0%</span>
                <span class="scratch-hud-target">/ <span id="scratch-hud-target-val">85%</span></span>
            </div>
            <div class="scratch-hud-track">
                <div id="scratch-hud-fill" class="scratch-hud-fill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 画笔大小调节艺术控件 -->
        <div id="brush-control" class="brush-control-panel">
            <button id="brush-toggle-btn" class="brush-btn" title="调节画笔与画作设置" aria-label="调节画笔大小">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18"/>
                    <path d="M2 2l7.586 7.586"/>
                    <circle cx="11" cy="11" r="2"/>
                </svg>
            </button>
            <div id="brush-popup" class="brush-popup">
                <!-- 交互模式选择：沉睡唤醒 vs 随机漫游 (分段选项卡，高亮直观，无冗余重复) -->
                <div class="mode-tabs">
                    <button id="mode-sleep-btn" class="fit-tab-btn active" type="button" title="触碰沉睡的静谧灰阶，用指尖唤醒稍纵即逝的真彩">🌸 沉睡唤醒</button>
                    <button id="mode-scratch-btn" class="fit-tab-btn" type="button" title="原画直出，划动擦去当前画作，露出背后的下一幅随机名画">🎲 随机漫游</button>
                </div>
                <div class="brush-popup-divider"></div>

                <div class="brush-popup-row">
                    <span class="brush-label">画笔大小</span>
                    <span id="brush-size-display" class="brush-value">75px</span>
                </div>
                <div class="brush-slider-container">
                    <input type="range" id="brush-size-slider" min="35" max="160" value="75" step="1">
                </div>
                <div class="brush-preview-wrap">
                    <div id="brush-preview-dot" class="brush-preview-dot"></div>
                </div>
                <div class="brush-popup-divider"></div>

                <!-- 1. 经典沉睡唤醒模式专用控制项 -->
                <div id="sleep-mode-controls">
                    <div class="brush-popup-row">
                        <span class="brush-label">色彩留存</span>
                        <span id="brush-duration-display" class="brush-value">12秒</span>
                    </div>
                    <div class="brush-slider-container">
                        <input type="range" id="brush-duration-slider" min="4" max="30" value="12" step="1">
                    </div>
                    <div class="brush-popup-divider"></div>
                    <div class="brush-quick-actions">
                        <button id="toggle-full-color-btn" class="full-color-btn" type="button" title="一键将整幅画还原为原始真彩">
                            <svg class="full-color-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                            </svg>
                            <span id="full-color-btn-text">一键全彩盛放</span>
                        </button>
                    </div>
                    <div class="brush-popup-divider"></div>
                </div>

                <!-- 2. 随机漫游擦画模式专用控制项 (原画直出，擦除透出下一幅) -->
                <div id="scratch-mode-controls" style="display: none;">
                    <div class="brush-popup-row">
                        <span class="brush-label">触发阈值</span>
                        <span id="scratch-threshold-display" class="brush-value">85%</span>
                    </div>
                    <div class="brush-slider-container">
                        <input type="range" id="scratch-threshold-slider" min="50" max="95" value="85" step="1">
                    </div>
                    <div class="brush-popup-row" style="margin-top: 6px;">
                        <span class="brush-label-sub">已揭开面积</span>
                        <span id="scratch-ratio-display" class="brush-value">0%</span>
                    </div>
                    <div class="scratch-mini-bar-bg">
                        <div id="scratch-mini-bar-fill" class="scratch-mini-bar-fill" style="width: 0%;"></div>
                    </div>
                    <div class="brush-popup-divider"></div>
                    <div class="brush-quick-actions">
                        <button id="scratch-reveal-now-btn" class="full-color-btn" type="button" title="直接完全展示背后的下一幅随机名画">
                            <span id="scratch-reveal-btn-text">✨ 立即完全展开下一幅</span>
                        </button>
                    </div>
                    <div class="brush-popup-divider"></div>
                </div>
                <div class="brush-popup-row">
                    <span class="brush-label">画面规格</span>
                    <span id="fit-mode-display" class="brush-badge">智能</span>
                </div>
                <div class="fit-mode-tabs">
                    <button id="fit-auto-btn" class="fit-tab-btn active" type="button" title="智能识别横竖画作自动匹配最佳构图">智能</button>
                    <button id="fit-contain-btn" class="fit-tab-btn" type="button" title="完整展示整幅画作，绝不裁剪任何花草">完整</button>
                    <button id="fit-cover-btn" class="fit-tab-btn" type="button" title="居中铺满全屏，无边框全景沉浸">铺满</button>
                </div>
                <div class="brush-popup-row fit-scale-row">
                    <span class="brush-label-sub">画面缩放</span>
                    <span id="fit-scale-display" class="brush-value">100%</span>
                </div>
                <div class="brush-slider-container">
                    <input type="range" id="fit-scale-slider" min="60" max="140" value="100" step="2">
                </div>
                <div class="brush-popup-divider"></div>
                <div class="brush-popup-row">
                    <span class="brush-label">🏛️ 传世名画展厅</span>
                    <span id="masterpiece-index" class="brush-badge">1 / 315</span>
                </div>
                <!-- 升级为美观的高级名画卡片入口，点击直达名画搜索与多维分类展厅 -->
                <div class="masterpiece-selector-box">
                    <button id="open-gallery-modal-btn" class="masterpiece-picker-btn" type="button" title="点击进入名画展厅 (支持按画家/题材分类检索)">
                        <div class="picker-thumb-wrap">
                            <img id="current-art-thumb" class="picker-thumb" src="" alt="当前画作">
                        </div>
                        <div class="picker-info">
                            <div id="current-art-title" class="picker-title">正在加载...</div>
                            <div id="current-art-artist" class="picker-artist">🔍 搜索·分类·全部名画 ▾</div>
                        </div>
                        <span class="picker-search-badge">🏛️</span>
                    </button>
                </div>
                <div class="masterpiece-nav-row">
                    <button id="prev-art-btn" class="art-nav-btn" type="button" title="切换上一幅名画">‹ 上一幅</button>
                    <button id="next-art-btn" class="art-nav-btn" type="button" title="切换下一幅名画">下一幅 ›</button>
                </div>
            </div>
        </div>

        <!-- 传世名画博览馆 · 典藏搜索与分类抽屉展厅 -->
        <div id="gallery-drawer" class="gallery-drawer" aria-hidden="true">
            <div id="gallery-backdrop" class="gallery-backdrop"></div>
            <aside class="gallery-panel" role="dialog" aria-modal="true" aria-labelledby="gallery-main-title">
                <!-- 展厅头部 -->
                <div class="gallery-header">
                    <div class="gallery-title-box">
                        <h2 id="gallery-main-title" class="gallery-main-title">
                            <span class="header-icon">🏛️</span> 传世名画博览馆
                        </h2>
                        <span class="gallery-sub-info">World Masterpieces · 315 幅传世杰作</span>
                    </div>
                    <button id="gallery-close-btn" class="gallery-close-btn" type="button" title="关闭展厅 (ESC)" aria-label="关闭名画展厅">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- 搜索栏区 -->
                <div class="gallery-search-wrap">
                    <div class="gallery-search-box">
                        <svg class="search-svg" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="gallery-search-input" class="gallery-search-input" placeholder="搜索画名、画家 (如: 蒙娜丽莎 / 达芬奇 / 梵高 / Monet)..." autocomplete="off" spellcheck="false">
                        <button id="gallery-search-clear" class="gallery-search-clear" type="button" title="清空搜索内容" style="display: none;">×</button>
                    </div>
                </div>

                <!-- 多维分类与筛选控制区 -->
                <div class="gallery-filter-panel">
                    <!-- 1. 题材分类药丸 (用户明确需求：历史画、神话故事画、风景画、人物画等) -->
                    <div class="filter-genre-section">
                        <div class="filter-section-header">
                            <span class="filter-title">题材分类</span>
                            <span class="filter-tip">点击快速筛选题材</span>
                        </div>
                        <div id="genre-pills-container" class="genre-pills-container">
                            <!-- 动态填充：全部题材、人物画像、神话宗教、历史故事、自然风景、静物花卉 -->
                        </div>
                    </div>

                    <!-- 2. 画家与时期组合筛选行 (用户明确需求：按画家区分) -->
                    <div class="filter-dropdowns-row">
                        <div class="filter-dropdown-cell">
                            <label for="artist-filter-select" class="dropdown-label">画家区分：</label>
                            <div class="dropdown-shell">
                                <select id="artist-filter-select" class="gallery-select-input">
                                    <option value="all">🎨 全部画家 (58位大师)</option>
                                </select>
                            </div>
                        </div>
                        <div class="filter-dropdown-cell">
                            <label for="category-filter-select" class="dropdown-label">时期画派：</label>
                            <div class="dropdown-shell">
                                <select id="category-filter-select" class="gallery-select-input">
                                    <option value="all">🏛️ 全部画派时期 (8大流派)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 热门艺术巨匠快捷直选胶囊 -->
                    <div class="quick-artists-section">
                        <span class="quick-artists-label">热门大师：</span>
                        <div id="quick-artists-container" class="quick-artists-container">
                            <!-- 动态填充快捷大师药丸：莫奈、梵高、达芬奇、维米尔、伦勃朗、米开朗基罗等 -->
                        </div>
                    </div>
                </div>

                <!-- 筛选结果统计与重置栏 -->
                <div class="gallery-meta-bar">
                    <div class="gallery-meta-count">
                        找到 <span id="gallery-result-count" class="meta-num">315</span> 幅名画
                        <span id="gallery-filter-desc" class="meta-filter-desc"></span>
                    </div>
                    <button id="gallery-reset-btn" class="gallery-reset-btn" type="button" style="display: none;">
                        重置所有筛选 ↺
                    </button>
                </div>

                <!-- 名画卡片滚动列表容器 -->
                <div id="gallery-list-container" class="gallery-list-container" role="list">
                    <!-- 动态生成 315 幅作品的高清卡片列表 -->
                </div>
            </aside>
        </div>
    </div>

    <!-- 传世名画博览馆数据库 -->
    <script src="data/masterpieces.js?v=4.3.0"></script>
    <!-- 核心渲染与交互脚本 -->
    <script src="app.js?v=4.3.0"></script>
</body>
</html>
